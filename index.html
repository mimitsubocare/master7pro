<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8dbe3">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>MASTER 7｜耳つぼケア学習</title>
<style>
:root{
  --pink:#ee91a9; --pink2:#f9dce4; --deep:#68464f; --ink:#3f3336;
  --cream:#fffaf8; --white:#fff; --gold:#e9b548; --blue:#55b5c8;
  --ok:#4aa77b; --ng:#d96a76; --line:#efd9df;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:
    radial-gradient(circle at 10% 0,#fff 0 8%,transparent 25%),
    linear-gradient(180deg,#f8dbe3 0%,#fff6f3 55%,#f8ece7 100%);
  min-height:100vh;
}
.wrap{max-width:540px;margin:auto;padding:14px 14px 38px}
.hero{
  background:rgba(255,255,255,.92);border:2px solid #fff;border-radius:28px;
  padding:18px 16px 16px;text-align:center;box-shadow:0 12px 30px rgba(115,73,83,.13);
}
.kicker{font-size:12px;font-weight:800;letter-spacing:.14em;color:#a36b79}
h1{font-size:38px;line-height:1;margin:7px 0 4px;color:#65404a;letter-spacing:.03em}
.sub{font-size:14px;font-weight:800;color:#a36b79;margin-bottom:6px}
.hero img{display:block;width:min(78%,350px);max-height:330px;object-fit:contain;margin:2px auto 0}
.lead{font-weight:800;font-size:15px;line-height:1.7;margin:4px auto 12px}
.menu{display:grid;gap:10px}
button{
  width:100%;border:0;border-radius:18px;padding:15px 14px;font-size:16px;
  font-weight:900;color:var(--ink);background:#fff;box-shadow:0 5px 15px rgba(93,65,71,.09);
  cursor:pointer;-webkit-tap-highlight-color:transparent
}
button:active{transform:scale(.985)}
.primary{background:linear-gradient(135deg,#ef91aa,#f4aab9);color:#fff}
.blue{background:linear-gradient(135deg,#6bc1d0,#4caec0);color:#fff}
.gold{background:linear-gradient(135deg,#f2c865,#e8ad3c);color:#5b4023}
.dark{background:#65464e;color:#fff}
.ghost{background:#fff7f8;border:1px solid #edccd5;color:#8d5d69}
.screen{display:none}.screen.active{display:block}
.topbar{display:flex;align-items:center;gap:9px;margin:4px 0 12px}
.back{width:auto;min-width:72px;padding:10px 12px;border-radius:14px;font-size:14px}
.title{font-size:21px;font-weight:950;color:#62414a}
.card{
  background:rgba(255,255,255,.95);border-radius:23px;padding:17px;margin:0 0 12px;
  box-shadow:0 8px 22px rgba(95,68,75,.10);border:1px solid rgba(255,255,255,.9)
}
.num{
  display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:var(--pink);color:#fff;font-weight:950;margin-right:8px
}
.point{font-size:20px;font-weight:950;color:#5d3f47;vertical-align:middle}
.alias{font-size:12px;font-weight:800;color:#a06d78;margin:6px 0 8px 44px}
.role{font-size:15px;line-height:1.75;margin-left:44px}
.note{font-size:12px;color:#8a7479;line-height:1.6}
.progress{height:10px;background:#f2e4e7;border-radius:999px;overflow:hidden;margin:8px 0 14px}
.progress>i{display:block;height:100%;background:var(--pink);width:0;transition:.25s}
.qno{text-align:center;font-size:13px;font-weight:900;color:#a16d79}
.question{text-align:center;font-size:20px;font-weight:950;line-height:1.55;margin:12px 0 16px}
.choices{display:grid;gap:9px}
.choice{background:#fff;border:2px solid #f0dce1;box-shadow:none}
.choice.correct{background:#eaf8f1;border-color:#76bf9b;color:#2d7757}
.choice.wrong{background:#fff0f2;border-color:#df8791;color:#9d4650}
.feedback{min-height:58px;margin-top:12px;padding:12px;border-radius:16px;background:#fff7f8;line-height:1.6;font-weight:800}
.next{margin-top:10px}
.missingBox{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:15px 0
}
.pill{padding:9px 11px;background:#fff;border:1px solid #edd7dd;border-radius:999px;font-weight:900;font-size:13px}
.pill.blank{background:#65464e;color:#fff;border-color:#65464e;min-width:82px}
.result{text-align:center}
.bigscore{font-size:54px;font-weight:950;color:#e7819c;line-height:1}
.rank{font-size:21px;font-weight:950;margin:8px 0}
.smallchar{width:150px;max-height:155px;object-fit:contain;margin:0 auto 8px;display:block}
.footer{text-align:center;font-size:11px;color:#9c858b;margin-top:16px}

.learnEar{position:relative;width:min(250px,72vw);margin:12px auto 14px}
.learnEar img{display:block;width:100%;height:auto}
.learnDot{position:absolute;width:18px;height:18px;border-radius:50%;background:#e94f71;border:3px solid #fff;box-shadow:0 0 0 3px rgba(233,79,113,.25),0 2px 7px rgba(0,0,0,.25);transform:translate(-50%,-50%);z-index:2}
.learnDot.all{width:14px;height:14px;border-width:2px}
.allEarBox{background:#fff7fa;border:1px solid #f3cbd5;border-radius:18px;padding:12px;margin:0 0 14px;text-align:center}
.allEarBox b{display:block;margin-bottom:4px}
.allEarLabels{font-size:12px;line-height:1.7;color:#6c5a5a;margin-top:6px}

#missingBox .intruderPick{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
#missingBox .intruderPick.correct{background:#dff5e9!important;border-color:#55b987!important;color:#176b48!important}
#missingBox .intruderPick.wrong{background:#ffe1e5!important;border-color:#e77d8d!important;color:#a12e42!important}
#missingBox .intruderPick:disabled{opacity:1}
</style>
</head>
<body>
<div class="wrap">

<section id="home" class="screen active">
  <div class="hero">
    <div class="kicker">耳つぼケア 学習アプリ</div>
    <h1>MASTER 7</h1>
    <div class="sub">7つ、ちゃんと使える？</div>
    <img src="./MASTER7.PNG" alt="MASTER 7">
    <div class="lead">まず7つを覚える。<br>次に「誰の仕事や？」で叩き込む。</div>
    <div class="menu">
      <button class="primary" onclick="showLearn()">7つを覚える</button>
      <button class="blue" onclick="startRoleQuiz()">ごちゃまぜ練習</button>
      <button class="gold" onclick="startMissing()">ひとり足らんで</button>
      <button class="dark" onclick="startFinal()">MASTER 7 最終テスト</button>
    </div>
  </div>
  <div class="footer">協会内学習用｜MASTER 7</div>
</section>

<section id="learn" class="screen">
  <div class="topbar"><button class="back ghost" onclick="goHome()">← TOP</button><div class="title">7つを覚える</div></div>
  <div id="learnList"></div>
</section>

<section id="quiz" class="screen">
  <div class="topbar"><button class="back ghost" onclick="goHome()">← TOP</button><div id="quizTitle" class="title">ごちゃまぜ練習</div></div>
  <div class="card">
    <div class="qno" id="qno"></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="question" id="question"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback">答えを選んでな。</div>
    <button id="nextBtn" class="primary next" style="display:none" onclick="nextQuestion()">次いくで</button>
  </div>
</section>

<section id="missing" class="screen">
  <div class="topbar"><button class="back ghost" onclick="goHome()">← TOP</button><div class="title">ひとり足らんで</div></div>
  <div class="card">
    <div class="qno" id="mno"></div>
    <div class="progress"><i id="mbar"></i></div>
    <div class="question">MASTER 7から消えたん誰や？</div>
    <div class="missingBox" id="missingBox"></div>
    <div class="choices" id="missingChoices"></div>
    <div class="feedback" id="missingFeedback">抜けてる1つを当ててな。</div>
    <button id="missingNext" class="primary next" style="display:none" onclick="nextMissing()">次いくで</button>
  </div>
</section>

<section id="result" class="screen">
  <div class="card result">
    <img class="smallchar" src="./MASTER7.PNG" alt="">
    <div class="kicker">RESULT</div>
    <div class="bigscore" id="scoreText"></div>
    <div class="rank" id="rankText"></div>
    <div id="resultMsg" class="lead"></div>
    <button class="primary" onclick="retryCurrent()">もう一回やる</button>
    <button class="ghost" style="margin-top:9px" onclick="goHome()">TOPへ戻る</button>
  </div>
</section>

</div>

<script>
const master7 = [
 {name:"耳中", alias:"ポイントゼロ", role:"生理的な恒常性をもたらす"},
 {name:"大脳皮質下", alias:"視床", role:"脳の誤作動による痛みのコントロール"},
 {name:"神門", alias:"", role:"不安を軽減し気分を高揚させる"},
 {name:"交感", alias:"交感神経", role:"血圧、自律神経系にわたる機能を調節する"},
 {name:"副腎", alias:"トランキライザーポイント", role:"鎮静、筋緊張を軽減"},
 {name:"内分泌", alias:"", role:"下垂体を介して全ホルモン系を活性化する"},
 {name:"耳先", alias:"アレルギーポイント", role:"喘息時の呼吸困難感、リウマチ、全身の炎症を抑える"}
];

let mode="", questions=[], qi=0, score=0, locked=false;
let missingQuestions=[], mi=0, mscore=0, mlocked=false;

function screensOff(){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"))}
function openScreen(id){screensOff();document.getElementById(id).classList.add("active");window.scrollTo({top:0,behavior:"smooth"})}
function goHome(){openScreen("home")}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

const master7Pos={
 "耳中":[49.7,47.4],"大脳皮質下":[48.5,64.6],"神門":[45.7,27.8],
 "交感":[31.7,30.5],"副腎":[27.3,55.7],"内分泌":[29,66.6],"耳先":[58.2,5.9]
};
function earMap(names,all=false){
 return `<div class="learnEar"><img src="./ear_base.PNG" alt="耳つぼ位置図">`+
 names.map(n=>{const p=master7Pos[n];return `<span class="learnDot${all?' all':''}" title="${n}" style="left:${p[0]}%;top:${p[1]}%"></span>`}).join("")+
 `</div>`;
}
function showLearn(){
 const box=document.getElementById("learnList");
 box.innerHTML=`<div class="allEarBox"><b>MASTER 7 全部の位置</b>${earMap(master7.map(x=>x.name),true)}<div class="allEarLabels">${master7.map(x=>x.name).join(" ／ ")}</div></div>`+
 master7.map((p,i)=>`
 <div class="card">
   <span class="num">${i+1}</span><span class="point">${p.name}</span>
   ${earMap([p.name])}
   ${p.alias?`<div class="alias">${p.alias}</div>`:`<div class="alias">　</div>`}
   <div class="role">${p.role}</div>
 </div>`).join("");
 openScreen("learn");
}

const all50 = ["神門","角窩中","内生殖器","交感","坐骨神経","股関節","膝","踝","風渓","腰仙椎","胸椎","頸椎","腕","肘","肩","鎖骨","後頭","側頭","前頭","大脳皮質下","顎","歯","内耳","目","扁桃体","内分泌","三焦","肺","心","気管","副腎","飢点","内鼻","咽喉","口","食道","噴門","胃","小腸","大腸","腎","膀胱","艇角","肝","脾","耳中","肛門","耳先","耳輪","耳迷根"];
const mNames=master7.map(x=>x.name);
const aliases=master7.filter(x=>x.alias);

function distractors(answer,n=3, pool=all50){
 return shuffle(pool.filter(x=>x!==answer)).slice(0,n);
}
function qRoleToName(p){
 return {q:`「${p.role}」<br>この役割のMASTER 7は？`,answer:p.name,
 choices:shuffle([p.name,...distractors(p.name)])};
}
function qNameToRole(p){
 const roles=master7.filter(x=>x.name!==p.name).map(x=>x.role);
 return {q:`<b>${p.name}</b> の役割はどれ？`,answer:p.role,
 choices:shuffle([p.role,...shuffle(roles).slice(0,3)])};
}
function qAliasToName(p){
 return {q:`「${p.alias}」と呼ばれるのは？`,answer:p.name,
 choices:shuffle([p.name,...distractors(p.name)])};
}
function qInMaster(){
 const answer=shuffle(mNames)[0];
 const non=all50.filter(x=>!mNames.includes(x));
 return {q:"MASTER 7に入っているのはどれ？",answer,
 choices:shuffle([answer,...shuffle(non).slice(0,3)])};
}
function qNotMaster(){
 const answer=shuffle(all50.filter(x=>!mNames.includes(x)))[0];
 return {q:"MASTER 7に入っていないのはどれ？",answer,
 choices:shuffle([answer,...shuffle(mNames).slice(0,3)])};
}
function qPair(){
 const p=shuffle(master7)[0];
 const wrongP=shuffle(master7.filter(x=>x.name!==p.name))[0];
 const correct=`${p.name} ＝ ${p.role}`;
 const wrongs=[
  `${p.name} ＝ ${wrongP.role}`,
  `${wrongP.name} ＝ ${p.role}`,
  `${shuffle(all50.filter(x=>!mNames.includes(x)))[0]} ＝ ${p.role}`
 ];
 return {q:"正しい組み合わせはどれ？",answer:correct,choices:shuffle([correct,...wrongs])};
}
function qAliasPair(){
 const p=shuffle(aliases)[0];
 const correct=`${p.alias} ＝ ${p.name}`;
 const wrongNames=shuffle(all50.filter(x=>x!==p.name)).slice(0,3);
 return {q:"正しい組み合わせはどれ？",answer:correct,
 choices:shuffle([correct,...wrongNames.map(n=>`${p.alias} ＝ ${n}`)])};
}
function buildMixed(count,final=false){
 let makers=[qRoleToName,qNameToRole,qInMaster,qNotMaster,qPair,qAliasToName,qAliasPair];
 let out=[];
 for(let i=0;i<count;i++){
   const maker=shuffle(makers)[0];
   let p=shuffle(maker===qAliasToName||maker===qAliasPair?aliases:master7)[0];
   out.push((maker===qInMaster||maker===qNotMaster||maker===qPair||maker===qAliasPair)?maker():maker(p));
 }
 if(final){
   // 最終テストは50ツボ判別問題を多めにする
   out[0]=qInMaster(); out[1]=qNotMaster(); out[2]=qInMaster(); out[3]=qNotMaster();
   out=shuffle(out);
 }
 return out;
}

function startRoleQuiz(){
 mode="role";questions=buildMixed(10,false);qi=0;score=0;
 document.getElementById("quizTitle").textContent="ごちゃまぜ練習";
 openScreen("quiz");renderQ();
}
function startFinal(){
 mode="final";questions=buildMixed(15,true);qi=0;score=0;
 document.getElementById("quizTitle").textContent="MASTER 7 最終テスト";
 openScreen("quiz");renderQ();
}
function renderQ(){
 locked=false;
 const q=questions[qi];
 document.getElementById("qno").textContent=`Q ${qi+1} / ${questions.length}`;
 document.getElementById("bar").style.width=`${(qi/questions.length)*100}%`;
 document.getElementById("question").innerHTML=q.q;
 document.getElementById("feedback").textContent="答えを選んでな。";
 document.getElementById("nextBtn").style.display="none";
 const c=document.getElementById("choices");c.innerHTML="";
 q.choices.forEach(v=>{
   const b=document.createElement("button");b.className="choice";b.textContent=v;
   b.onclick=()=>answerQ(v,b);c.appendChild(b);
 });
}
function answerQ(v,b){
 if(locked)return;locked=true;
 const q=questions[qi], buttons=[...document.querySelectorAll("#choices .choice")];
 buttons.forEach(x=>{
   if(x.textContent===q.answer)x.classList.add("correct");
   else if(x===b)x.classList.add("wrong");
 });
 if(v===q.answer){
   score++;document.getElementById("feedback").innerHTML="○ 正解！<br>その調子やで。";
 }else{
   document.getElementById("feedback").innerHTML=`× おしい！<br>正解は <b>${q.answer}</b>。`;
 }
 document.getElementById("bar").style.width=`${((qi+1)/questions.length)*100}%`;
 document.getElementById("nextBtn").style.display="block";
}
function nextQuestion(){
 qi++;
 if(qi>=questions.length){showResult(score,questions.length);return}
 renderQ();
}

function startMissing(){
 mode="missing";mi=0;mscore=0;
 // 7問。毎回「ひとり足らんで」と「誰やお前」を混ぜる
 missingQuestions=shuffle(master7).map((p,i)=>({
   type:i<4?"missing":"intruder",
   answer:p.name
 }));
 missingQuestions=shuffle(missingQuestions);
 openScreen("missing");renderMissing();
}
function renderMissing(){
 mlocked=false;
 const q=missingQuestions[mi];
 document.getElementById("mno").textContent=`Q ${mi+1} / ${missingQuestions.length}`;
 document.getElementById("mbar").style.width=`${(mi/missingQuestions.length)*100}%`;

 const names=master7.map(x=>x.name);
 const nonMaster=all50.filter(n=>!names.includes(n));
 const box=document.getElementById("missingBox");
 const c=document.getElementById("missingChoices");
 c.innerHTML="";

 if(q.type==="missing"){
   // 6人＋？？？を毎回シャッフル
   const shown=shuffle([...names.filter(n=>n!==q.answer),"？？？"]);
   box.innerHTML=shown.map(n=>`<span class="pill ${n==="？？？"?"blank":""}">${n}</span>`).join("");

   // 正解＋MASTER7以外3つ。上段と重複なし
   const opts=shuffle([q.answer,...shuffle(nonMaster).slice(0,3)]);
   opts.forEach(v=>{
     const b=document.createElement("button");b.className="choice";b.textContent=v;
     b.onclick=()=>answerMissing(v,b,q.answer,"missing");
     c.appendChild(b);
   });
   document.getElementById("missingFeedback").textContent="ひとり足らんで。抜けてるMASTER 7は誰？";
 }else{
   // 6人のMASTER7＋偽物1人を完全シャッフル
   const intruder=shuffle(nonMaster)[0];
   q.answer=intruder;
   const masterSix=shuffle(names).slice(0,6);
   const shown=shuffle([...masterSix,intruder]);

   // 「誰やお前」は上の札そのものをタップして回答
   box.innerHTML=shown.map(n=>`<button type="button" class="pill intruderPick" data-name="${n}">${n}</button>`).join("");
   box.querySelectorAll(".intruderPick").forEach(b=>{
     b.onclick=()=>answerIntruder(b.dataset.name,b,intruder);
   });
   document.getElementById("missingFeedback").textContent="誰やお前🤣 MASTER 7じゃない耳つぼを上から直接タップ。";
 }
 document.getElementById("missingNext").style.display="none";
}

function answerMissing(v,b,answer,type){
 if(mlocked)return;mlocked=true;
 [...document.querySelectorAll("#missingChoices .choice")].forEach(x=>{
   if(x.textContent===answer)x.classList.add("correct");
   else if(x===b)x.classList.add("wrong");
 });
 if(v===answer){
   mscore++;
   document.getElementById("missingFeedback").textContent="○ おるべき人、帰ってきたで🤣";
 }else{
   document.getElementById("missingFeedback").innerHTML=`× 足らんかったんは <b>${answer}</b> やで。`;
 }
 document.getElementById("mbar").style.width=`${((mi+1)/missingQuestions.length)*100}%`;
 document.getElementById("missingNext").style.display="block";
}

function answerIntruder(v,b,answer){
 if(mlocked)return;mlocked=true;
 document.querySelectorAll("#missingBox .intruderPick").forEach(x=>{
   if(x.dataset.name===answer)x.classList.add("correct");
   else if(x===b)x.classList.add("wrong");
   x.disabled=true;
 });
 if(v===answer){
   mscore++;
   document.getElementById("missingFeedback").textContent="○ 発見🤣 お前MASTER 7ちゃうやろ。";
 }else{
   document.getElementById("missingFeedback").innerHTML=`× 乱入してたんは <b>${answer}</b> やで🤣`;
 }
 document.getElementById("mbar").style.width=`${((mi+1)/missingQuestions.length)*100}%`;
 document.getElementById("missingNext").style.display="block";
}

function nextMissing(){
 mi++;
 if(mi>=missingQuestions.length){showResult(mscore,missingQuestions.length);return}
 renderMissing();
}

function showResult(s,total){
 score=s;
 openScreen("result");
 const pct=Math.round(s/total*100);
 document.getElementById("scoreText").textContent=`${s} / ${total}`;
 let rank,msg;
 if(pct===100){rank="MASTER 7 完全制覇！";msg="7人全員、ちゃんと頭におる🤣";}
 else if(pct>=80){rank="ほぼマスター！";msg="あとちょい。ここまで来たら逃がさんで。";}
 else if(pct>=60){rank="ええ感じ！";msg="覚えてきてる。もう一周したら強い。";}
 else {rank="7人、まだ自由行動中🤣";msg="まず「7つを覚える」から回収しよ。";}
 document.getElementById("rankText").textContent=rank;
 document.getElementById("resultMsg").textContent=msg;
}
function retryCurrent(){
 if(mode==="role")startRoleQuiz();
 else if(mode==="final")startFinal();
 else startMissing();
}
</script>
</body>
</html>
